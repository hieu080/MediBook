name: Backend CI/CD

on:
  push:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: hieu080
  BACKEND_SERVICES: >-
    api-gateway
    identity-service
    patient-service
    doctor-schedule-service
    appointment-service
    payment-service
    queue-service
    notification-service
    reporting-service
    audit-service

jobs:
  build-backend-images:
    name: Build Backend Images
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - identity-service
          - patient-service
          - doctor-schedule-service
          - appointment-service
          - payment-service
          - queue-service
          - notification-service
          - reporting-service
          - audit-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/medibook-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  build-keycloak-image:
    name: Build Keycloak Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/medibook-keycloak
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Keycloak
        uses: docker/build-push-action@v6
        with:
          context: ./keycloak
          file: ./keycloak/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,scope=keycloak,mode=max

  deploy:
    name: Deploy Backend Stack
    runs-on: self-hosted
    needs:
      - build-backend-images
      - build-keycloak-image

    steps:
      - name: Deploy backend stack
        run: |
          set -e
          cd /opt/medibook
          docker compose -p medibook --env-file .env -f docker-compose.prod.yml pull \
            api-gateway \
            identity-service \
            patient-service \
            doctor-schedule-service \
            appointment-service \
            payment-service \
            queue-service \
            notification-service \
            reporting-service \
            audit-service \
            keycloak
          docker compose -p medibook --env-file .env -f docker-compose.prod.yml up -d \
            api-gateway \
            identity-service \
            patient-service \
            doctor-schedule-service \
            appointment-service \
            payment-service \
            queue-service \
            notification-service \
            reporting-service \
            audit-service \
            keycloak
          docker image prune -f
