spring:
  application:
    name: api-gateway
  profiles:
    active: local
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/medibook}
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: http://${IDENTITY_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: patient-service
          uri: http://${PATIENT_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/v1/patients/**
        - id: doctor-schedule-service
          uri: http://${DOCTOR_SCHEDULE_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/api/v1/facilities/**,/api/v1/specialties/**,/api/v1/doctors/**,/api/v1/schedules/**
        - id: appointment-service
          uri: http://${APPOINTMENT_SERVICE_HOST:localhost}:8084
          predicates:
            - Path=/api/v1/appointments/**,/api/v1/reception/**
        - id: payment-service
          uri: http://${PAYMENT_SERVICE_HOST:localhost}:8085
          predicates:
            - Path=/api/v1/payments/**
        - id: queue-service
          uri: http://${QUEUE_SERVICE_HOST:localhost}:8086
          predicates:
            - Path=/api/v1/queue/**
        - id: notification-service
          uri: http://${NOTIFICATION_SERVICE_HOST:localhost}:8087
          predicates:
            - Path=/api/v1/notifications/**
        - id: reporting-service
          uri: http://${REPORTING_SERVICE_HOST:localhost}:8088
          predicates:
            - Path=/api/v1/reports/**
        - id: audit-service
          uri: http://${AUDIT_SERVICE_HOST:localhost}:8089
          predicates:
            - Path=/api/v1/audit/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
