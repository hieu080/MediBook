spring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:identity_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/medibook
keycloak.issuer-uri=http://localhost:8180/realms/medibook
keycloak.token-uri=http://localhost:8180/realms/medibook/protocol/openid-connect/token
keycloak.logout-uri=http://localhost:8180/realms/medibook/protocol/openid-connect/logout
keycloak.admin-base-url=http://localhost:8180
keycloak.realm=medibook
keycloak.client-id=identity-service
keycloak.client-secret=test-secret
