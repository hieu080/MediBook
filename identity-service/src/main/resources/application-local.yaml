spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:public}
    open-in-view: false
  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:public}
    default-schema: ${DB_SCHEMA:public}
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO

security:
  jwt:
    key-id: ${JWT_KEY_ID:identity-service-key}
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:identity-service/keys/jwt-private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:identity-service/keys/jwt-public.pem}
    access-token-expiration: ${ACCESS_TOKEN_EXPIRE_MILISECONDS}
    refresh-token-expiration: ${REFRESH_TOKEN_EXPIRE_MILISECONDS}
    issuer: ${JWT_ISSUER:identity-service}
    header-name: Authorization
    token-prefix: Bearer

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
