x-postgres-env: &postgres-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres

x-service-db-env: &service-db-env
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  DB_SCHEMA: public

services:
  redis:
    image: redis:7-alpine
    container_name: medibook-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: medibook-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  postgres-identity:
    image: postgres:15
    container_name: medibook-postgres-identity
    environment:
      <<: *postgres-env
      POSTGRES_DB: medibook_identity_db
    ports:
      - "5433:5432"
    volumes:
      - pg_identity_data:/var/lib/postgresql/data

  postgres-patient:
    image: postgres:15
    container_name: medibook-postgres-patient
    environment:
      <<: *postgres-env
      POSTGRES_DB: medibook_patient_db
    ports:
      - "5434:5432"
    volumes:
      - pg_patient_data:/var/lib/postgresql/data

  postgres-doctor-schedule:
    image: postgres:15
    container_name: medibook-postgres-doctor-schedule
    environment:
      <<: *postgres-env
      POSTGRES_DB: medibook_doctor_schedule_db
    ports:
      - "5435:5432"
    volumes:
      - pg_doctor_schedule_data:/var/lib/postgresql/data

  postgres-appointment:
    image: postgres:15
    container_name: medibook-postgres-appointment
    environment:
      <<: *postgres-env
      POSTGRES_DB: medibook_appointment_db
    ports:
      - "5436:5432"
    volumes:
      - pg_appointment_data:/var/lib/postgresql/data

  postgres-payment:
    image: postgres:15
    container_name: medibook-postgres-payment
    environment:
      <<: *postgres-env
      POSTGRES_DB: medibook_payment_db
    ports:
      - "5437:5432"
    volumes:
      - pg_payment_data:/var/lib/postgresql/data

  postgres-queue:
    image: postgres:15
    container_name: medibook-postgres-queue
    environment:
      <<: *postgres-env
      POSTGRES_DB: medibook_queue_db
    ports:
      - "5438:5432"
    volumes:
      - pg_queue_data:/var/lib/postgresql/data

  postgres-notification:
    image: postgres:15
    container_name: medibook-postgres-notification
    environment:
      <<: *postgres-env
      POSTGRES_DB: medibook_notification_db
    ports:
      - "5439:5432"
    volumes:
      - pg_notification_data:/var/lib/postgresql/data

  postgres-reporting:
    image: postgres:15
    container_name: medibook-postgres-reporting
    environment:
      <<: *postgres-env
      POSTGRES_DB: medibook_reporting_db
    ports:
      - "5440:5432"
    volumes:
      - pg_reporting_data:/var/lib/postgresql/data

  postgres-audit:
    image: postgres:15
    container_name: medibook-postgres-audit
    environment:
      <<: *postgres-env
      POSTGRES_DB: medibook_audit_db
    ports:
      - "5441:5432"
    volumes:
      - pg_audit_data:/var/lib/postgresql/data

  postgres-keycloak:
    image: postgres:16
    container_name: medibook-postgres-keycloak
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: medibook_keycloak_db
    ports:
      - "5442:5432"
    volumes:
      - pg_keycloak_data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: medibook-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres-keycloak
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: medibook_keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    depends_on:
      - postgres-keycloak
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import

  api-gateway:
    build: ./api-gateway
    container_name: medibook-api-gateway
    environment:
      IDENTITY_SERVICE_HOST: identity-service
      PATIENT_SERVICE_HOST: patient-service
      DOCTOR_SCHEDULE_SERVICE_HOST: doctor-schedule-service
      APPOINTMENT_SERVICE_HOST: appointment-service
      PAYMENT_SERVICE_HOST: payment-service
      QUEUE_SERVICE_HOST: queue-service
      NOTIFICATION_SERVICE_HOST: notification-service
      REPORTING_SERVICE_HOST: reporting-service
      AUDIT_SERVICE_HOST: audit-service
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/medibook
    depends_on:
      - identity-service
      - patient-service
      - doctor-schedule-service
      - appointment-service
      - payment-service
      - queue-service
      - notification-service
      - reporting-service
      - audit-service
    ports:
      - "8080:8080"

  identity-service:
    build:
      context: .
      dockerfile: identity-service/Dockerfile
    container_name: medibook-identity-service
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      <<: *service-db-env
      DB_HOST: postgres-identity
      DB_PORT: 5432
      DB_NAME: medibook_identity_db
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/medibook
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/medibook/protocol/openid-connect/token
      KEYCLOAK_LOGOUT_URI: http://keycloak:8080/realms/medibook/protocol/openid-connect/logout
      KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: medibook
      KEYCLOAK_CLIENT_ID: identity-service
      KEYCLOAK_CLIENT_SECRET: identity-service-secret
    depends_on:
      - postgres-identity
      - keycloak
    ports:
      - "8081:8081"

  patient-service:
    build: ./patient-service
    container_name: medibook-patient-service
    environment:
      <<: *service-db-env
      DB_HOST: postgres-patient
      DB_PORT: 5432
      DB_NAME: medibook_patient_db
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/medibook
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/medibook/protocol/openid-connect/token
      SERVICE_CLIENT_ID: patient-service
      SERVICE_CLIENT_SECRET: patient-service-secret
    depends_on:
      - postgres-patient
    ports:
      - "8082:8082"

  doctor-schedule-service:
    build: ./doctor-schedule-service
    container_name: medibook-doctor-schedule-service
    environment:
      <<: *service-db-env
      DB_HOST: postgres-doctor-schedule
      DB_PORT: 5432
      DB_NAME: medibook_doctor_schedule_db
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/medibook
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/medibook/protocol/openid-connect/token
      SERVICE_CLIENT_ID: doctor-schedule-service
      SERVICE_CLIENT_SECRET: doctor-schedule-service-secret
    depends_on:
      - postgres-doctor-schedule
    ports:
      - "8083:8083"

  appointment-service:
    build: ./appointment-service
    container_name: medibook-appointment-service
    environment:
      <<: *service-db-env
      DB_HOST: postgres-appointment
      DB_PORT: 5432
      DB_NAME: medibook_appointment_db
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/medibook
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/medibook/protocol/openid-connect/token
      SERVICE_CLIENT_ID: appointment-service
      SERVICE_CLIENT_SECRET: appointment-service-secret
    depends_on:
      - postgres-appointment
    ports:
      - "8084:8084"

  payment-service:
    build: ./payment-service
    container_name: medibook-payment-service
    environment:
      <<: *service-db-env
      DB_HOST: postgres-payment
      DB_PORT: 5432
      DB_NAME: medibook_payment_db
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/medibook
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/medibook/protocol/openid-connect/token
      SERVICE_CLIENT_ID: payment-service
      SERVICE_CLIENT_SECRET: payment-service-secret
    depends_on:
      - postgres-payment
    ports:
      - "8085:8085"

  queue-service:
    build: ./queue-service
    container_name: medibook-queue-service
    environment:
      <<: *service-db-env
      DB_HOST: postgres-queue
      DB_PORT: 5432
      DB_NAME: medibook_queue_db
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/medibook
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/medibook/protocol/openid-connect/token
      SERVICE_CLIENT_ID: queue-service
      SERVICE_CLIENT_SECRET: queue-service-secret
    depends_on:
      - postgres-queue
    ports:
      - "8086:8086"

  notification-service:
    build: ./notification-service
    container_name: medibook-notification-service
    environment:
      <<: *service-db-env
      DB_HOST: postgres-notification
      DB_PORT: 5432
      DB_NAME: medibook_notification_db
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/medibook
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/medibook/protocol/openid-connect/token
      SERVICE_CLIENT_ID: notification-service
      SERVICE_CLIENT_SECRET: notification-service-secret
    depends_on:
      - postgres-notification
    ports:
      - "8087:8087"

  reporting-service:
    build: ./reporting-service
    container_name: medibook-reporting-service
    environment:
      <<: *service-db-env
      DB_HOST: postgres-reporting
      DB_PORT: 5432
      DB_NAME: medibook_reporting_db
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/medibook
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/medibook/protocol/openid-connect/token
      SERVICE_CLIENT_ID: reporting-service
      SERVICE_CLIENT_SECRET: reporting-service-secret
    depends_on:
      - postgres-reporting
    ports:
      - "8088:8088"

  audit-service:
    build: ./audit-service
    container_name: medibook-audit-service
    environment:
      <<: *service-db-env
      DB_HOST: postgres-audit
      DB_PORT: 5432
      DB_NAME: medibook_audit_db
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/medibook
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/medibook/protocol/openid-connect/token
      SERVICE_CLIENT_ID: audit-service
      SERVICE_CLIENT_SECRET: audit-service-secret
    depends_on:
      - postgres-audit
    ports:
      - "8089:8089"

volumes:
  pg_identity_data:
  pg_patient_data:
  pg_doctor_schedule_data:
  pg_appointment_data:
  pg_payment_data:
  pg_queue_data:
  pg_notification_data:
  pg_reporting_data:
  pg_audit_data:
  pg_keycloak_data:
